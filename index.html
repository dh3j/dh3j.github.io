<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dh3j</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --bg-primary: #000000;
            --bg-secondary: #000000;
            --bg-tertiary: #0a0a0a;
            --bg-card: #050505;
            --accent-primary: #ffffff;
            --accent-secondary: #ffffff;
            --text-primary: #ffffff;
            --text-secondary: #ffffff;
            --text-tertiary: #aaaaaa;
            --border-primary: #1a1a1a;
            --border-secondary: #222222;
            --glow-primary: #ffffff;
            --glow-secondary: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .app-container.animate-in {
            opacity: 1;
        }

        #bg-start-audio {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100000000;
            background: #000;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            display: flex;
            transition: opacity 0.2s ease-in-out;
            cursor: pointer;
            font-size: 15.2px;
        }

        #bg-start-audio h1 {
            transition: opacity 0.05s ease-in-out;
            opacity: 1;
            color: #ffffff;
        }

        /* Improved volume control */
        #volume-control {
            background: #000000;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10000;
            color: #fff;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 44px;
            height: 44px;
            opacity: 0;
            overflow: hidden;
            transition: opacity .4s ease-out, height 0.25s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        #volume-control.animate-in {
            opacity: 1;
        }

        #volume-control:hover,
        #volume-control:focus-within {
            height: 150px;
            border-color: #555;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.8);
        }

        #volume-icon-wrap {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #volume-icon {
            width: 18px;
            height: 18px;
            display: block;
            color: #ffffff;
            transition: opacity 0.2s ease;
        }

        #volume-slider-wrap {
            width: 44px;
            height: 0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            transition: height 0.25s ease, opacity 0.2s ease;
        }

        #volume-control:hover #volume-slider-wrap,
        #volume-control:focus-within #volume-slider-wrap {
            height: 100px;
            opacity: 1;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            flex-shrink: 0;
            height: 3px;
            border-radius: 2px;
            background: #333;
            outline: none;
            cursor: pointer;
            transform: rotate(-90deg);
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        #volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        #song-credit {
            position: fixed;
            bottom: 10px;
            right: 12px;
            z-index: 500;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            letter-spacing: 0.02em;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
            overflow-y: hidden;
            line-height: 1.6;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
            opacity: 0;
            transition: opacity .5s ease-out, transform 1s ease-out;
        }

        .left-panel {
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            border-right: 1px solid #1a1a1a;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: fixed;
            top: 50%;
            left: 100px;
            transform: translateY(-50%);
            height: auto;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #1a1a1a;
            transition-delay: 0.2s;
        }

        .panel-header {
            padding: 0 1.5rem 1rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .panel-header i {
            font-size: 1rem;
            color: #aaa;
        }

        .panel-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0 8px 8px 0;
            color: #ccc;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .panel-item:hover {
            background: #111;
            color: #ffffff;
        }

        .panel-item.active {
            background: #111;
            color: #ffffff;
            font-weight: 600;
            border-left: 3px solid #ffffff;
            padding-left: calc(1.5rem - 3px);
        }

        .panel-item.active:hover {
            opacity: 0.95;
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 200px;
        }

        .section {
            background: #050505;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto 40px auto;
            width: 100%;
            min-height: auto;
            scroll-margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out,
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section:last-child {
            margin-bottom: 0;
        }

        #profileBio {
            margin-bottom: 40px !important;
            transition-delay: 0.3s;
        }

        #staffExperience {
            transition-delay: 0.5s;
        }

        #profileName {
            margin-top: -0.3rem;
        }

        .section-header {
            justify-content: center;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            font-size: 1.125rem;
            font-weight: 700;
            color: #ffffff;
        }

        .section-icon {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .profile-wrapper {
            position: relative;
            display: inline-block;
            width: 150px;
            height: 150px;
        }

        .profile-border {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #333, #fff, #333, #fff);
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            animation: rotate 8s linear infinite;
        }

        .profile-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .profile-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .section-bio h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 500;
        }

        .bio-tabs {
            margin-top: 0.75rem;
            color: #ccc;
        }

        .bio-tab {
            margin-bottom: 0.35rem;
            color: #ccc;
        }

        .bio-tab strong {
            color: #ffffff;
        }

        .staff-category {
            margin: 20px auto;
            max-width: 1000px;
        }

        .staff-category h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            margin-bottom: 1rem;
            padding-left: 0;
            color: #ffffff;
        }

        .staff-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .server-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 120px;
            justify-content: center;
        }

        .server-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #ffffff;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .server-card:hover::before {
            transform: scaleX(1);
        }

        .server-card:hover {
            border-color: #333;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .server-info h4 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .server-role {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .server-year {
            color: #888;
            font-size: 0.8rem;
            margin-top: 0.1rem;
            margin-bottom: 0.3rem;
            line-height: 1;
        }

        .profile-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .bio-details {
            text-align: left;
            margin-top: 1.5rem;
            color: #ccc;
        }

        .bio-details p {
            margin-bottom: 0.75rem;
            line-height: 1.8;
            font-size: 1rem;
        }

        .bio-details strong {
            color: #ffffff;
            font-weight: 600;
        }

        .bio-staff-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
            width: 100%;
        }

        .bio-staff-category {
            margin-top: 2rem;
            text-align: center;
        }

        .bio-staff-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .bio-section-header {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 0.25rem;
        }

        .bio-staff-section {
            margin-top: 2.5rem;
            width: 100%;
        }

        .bio-links-section {
            margin-top: 2.5rem;
            width: 100%;
        }

        .bio-links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        /* Current Staff section inside Bio - secondary style */
        .current-staff-section {
            margin-top: 2.5rem;
            width: 100%;
        }

        .current-staff-section .bio-staff-title {
            margin-bottom: 1.25rem;
        }

        .current-staff-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 0.5rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes textGradient {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Fully black background - no red gradient */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: #000000;
            opacity: 1;
        }

        @media (max-width: 1024px) {
            .left-panel {
                left: 20px;
                width: 290px;
            }
            .main-content {
                margin-left: 270px;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            .left-panel {
                width: 100%;
                height: auto;
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                max-height: none;
                margin-bottom: 1rem;
                border-right: none;
                border-bottom: 1px solid #1a1a1a;
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
                padding: 1rem;
                border-radius: 0;
            }
            .panel-item {
                flex: 1 1 auto;
                max-width: 150px;
                justify-content: center;
                border-left: none;
                border-radius: 8px;
                padding-left: 1.5rem;
            }
            .panel-item.active {
                border-left: none;
                padding-left: 1.5rem;
            }
            .main-content {
                padding: 1rem;
                margin-left: 0;
            }
            .section {
                max-width: 100%;
                margin: 20px auto;
                min-height: auto;
                padding: 1.5rem;
            }
            .staff-grid,
            .current-staff-grid,
            .bio-links-grid {
                grid-template-columns: 1fr;
            }
            .panel-header {
                display: none;
            }
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            z-index: 1000;
        }

        .scroll-progress-bar {
            height: 100%;
            background: #ffffff;
            width: 0%;
            transition: width 0.2s ease;
        }

        ::selection {
            background: #ffffff;
            color: #000000;
        }

        ::-moz-selection {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>

<body>
    <div id="bg-start-audio">
        <h1>Click Anywhere</h1>
    </div>

    <audio id="bg-music" loop>
        <source src="canzone.mp3" type="audio/mp3">
        Il tuo browser non supporta l'elemento audio.
    </audio>

    <div id="volume-control">
        <div id="volume-icon-wrap">
            <svg id="volume-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <defs>
                    <mask id="volumeIconMask">
                        <g fill="none" stroke="#fff" stroke-width="4">
                            <path fill="#555" stroke-linejoin="round" d="M24 6v36c-7 0-12.201-9.16-12.201-9.16H6a2 2 0 0 1-2-2V17.01a2 2 0 0 1 2-2h5.799S17 6 24 6Z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M32 15a11.91 11.91 0 0 1 1.684 1.859A12.07 12.07 0 0 1 36 24c0 2.654-.846 5.107-2.278 7.09A11.936 11.936 0 0 1 32 33"></path>
                            <path stroke-linecap="round" d="M34.236 41.186C40.084 37.696 44 31.305 44 24c0-7.192-3.796-13.496-9.493-17.02"></path>

    <div id="song-credit">CD: Filmografo & Tudoss</div>

    <div class="scroll-progress">

    <div class="app-container">
        <aside class="left-panel">
            <div class="panel-header"><i class="fa-solid fa-list"></i></div>
            <div class="panel-item active" data-section="profileBio">
                <i class="fa-solid fa-user"></i>
                <span>Bio</span>
            </div>

                <span>Staff Experience</span>
            </div>
        </aside>

        <div class="main-content">
            <section class="section" id="profileBio">
                <div class="section-header">
                    <div class="section-icon"><i class="fa-solid fa-user"></i></div>
                    <span>Bio</span>
                </div>
                <div class="hero-content">
                    <div class="profile-wrapper">
                        <div class="profile-border"></div>
                        <div class="profile-image">
                            <div class="profile-inner" id="profileAvatar"></div>
                        </div>
                    </div>
                    <h1 id="profileName" style="
                    font-size: clamp(2.5rem, 5vw, 4rem);
                    font-weight: 900;
                    color: #ffffff;
                    margin-bottom: 0;
                    letter-spacing: -0.02em;
                "></h1>
                    <p class="subtitle" id="profileSubtitle"></p>
                    <div class="bio-tabs">

                        </div>

                        <div class="bio-tab">

                        <h3 class="bio-staff-title"><i class="fa-solid fa-link"></i> LINKS</h3>

    <script>
        const CONFIG = {
            profile: {
                name: "dh3j",
                avatar: "avatar.png",
                subtitle: "Student & Screenshare",
            },
            currentStaff: [
                { serverName: "-", role: "Integrity Team", color: "#ff2b2b", imgurLink: null }
            ],
            staffExperience: {
                discord: [
                    { serverName: "SpyralMC", role: "Beta Tester", color: "#b134eb", imgurLink: null }
                ],
                minecraft: [
                    { serverName: "PixyMC", role: "Jr.Mod, SS Verified, SS Mentor", color: "#33ccff", imgurLink: null },
                    { serverName: "PixyMC", role: "Sr.Helper", color: "#166534", imgurLink: null },
                    { serverName: "MetaMC", role: "Trainee", color: "#facc15", imgurLink: null }
                ]
            },
            links: [
                { name: "NameMC", role: "dh3j", icon: "fa-solid fa-network-wired", color: "#FFFFFF", link: "https://namemc.com/profile/dh3j" },
                { name: "Discord", role: "@dh3j", icon: "fa-brands fa-discord", color: "#5865F2", link: "https://discord.com/users/1015574934354919455" }
            ]
        };

        function initializeProfile() {
            const avatarContainer = document.getElementById('profileAvatar');
            avatarContainer.innerHTML = `<img src="${CONFIG.profile.avatar}" alt="Profile avatar">`;
            document.getElementById('profileName').textContent = CONFIG.profile.name;
            document.getElementById('profileSubtitle').innerHTML = `<i class="fa-solid fa-magnifying-glass" style="transform: scaleX(-1);"></i> ${CONFIG.profile.subtitle}`;
        }

        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const bigint = parseInt(c, 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function createCategory(targetSectionId, title, icon, servers) {
            if (!servers || servers.length === 0) return;
            const section = document.getElementById(targetSectionId);
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'staff-category';
            categoryDiv.innerHTML = `<h3><i class="${icon}"></i> ${title}</h3><div class="staff-grid"></div>`;
            const grid = categoryDiv.querySelector('.staff-grid');

            servers.forEach(server => {
                const card = document.createElement('div');
                card.className = 'server-card';

                if (server.imgurLink) {
                    card.addEventListener('click', () => window.open(server.imgurLink, '_blank', 'noopener,noreferrer'));
                } else {
                    card.style.cursor = 'default';
                }

                const yearHtml = server.year ? `<div class="server-year">${server.year}</div>` : '';

                card.innerHTML = `
                    <div class="server-info">
                        <h4>${server.serverName}</h4>
                        ${yearHtml}
                        <div class="server-role">${server.role}</div>
                    </div>
                `;

                if (server.color) {
                    const roleEl = card.querySelector('.server-role');
                    roleEl.style.background = hexToRgba(server.color, 0.12);
                    roleEl.style.borderColor = hexToRgba(server.color, 0.25);
                    roleEl.style.color = server.color;
                }
                grid.appendChild(card);
            });

            section.appendChild(categoryDiv);
        }

        function createGenericCards(targetElement, items) {
            const container = document.querySelector(targetElement);
            if (!container) return;
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'server-card';

                card.addEventListener('click', () => window.open(item.link, '_blank', 'noopener,noreferrer'));

                const cardName = item.name || item.role;
                card.innerHTML = `
                    <div class="server-info">
                        <h4>${item.icon ? `<i class="${item.icon}"></i>&nbsp;` : ''}${cardName}</h4>
                        <div class="server-role">${item.role}</div>
                    </div>
                `;
                if (item.color) {
                    const roleEl = card.querySelector('.server-role');
                    roleEl.style.background = hexToRgba(item.color, 0.12);
                    roleEl.style.borderColor = hexToRgba(item.color, 0.25);
                    roleEl.style.color = item.color;
                }
                container.appendChild(card);
            });
        }

        function createCurrentStaffCards(items) {
            const container = document.getElementById('currentStaffGrid');
            if (!container) return;
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.style.cursor = 'default';

                card.innerHTML = `
                    <div class="server-info">
                        <h4>${item.serverName}</h4>
                        <div class="server-role">${item.role}</div>
                    </div>
                `;
                if (item.color) {
                    const roleEl = card.querySelector('.server-role');
                    roleEl.style.background = hexToRgba(item.color, 0.12);
                    roleEl.style.borderColor = hexToRgba(item.color, 0.25);
                    roleEl.style.color = item.color;
                }
                container.appendChild(card);
            });
        }

        function highlightActiveSection() {
            const sections = document.querySelectorAll('.section');
            const navItems = document.querySelectorAll('.panel-item');
            let currentSection = 'profileBio';

            const viewportMiddle = window.scrollY + (window.innerHeight / 2);

            let closestSection = sections[0];
            let minDistance = Math.abs(viewportMiddle - (sections[0].offsetTop + sections[0].offsetHeight / 2));

            sections.forEach(section => {
                const sectionMiddle = section.offsetTop + (section.offsetHeight / 2);
                const distance = Math.abs(viewportMiddle - sectionMiddle);

                if (distance < minDistance) {
                    minDistance = distance;
                    closestSection = section;
                }
            });

            currentSection = closestSection.id;

            navItems.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-section') === currentSection) {
                    item.classList.add('active');
                }
            });

            updateProgressBar();
        }

        function updateProgressBar() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            document.querySelector('.scroll-progress-bar').style.width = scrolled + '%';
        }

        const bgStartAudio = document.getElementById('bg-start-audio');
        const bgStartAudioH1 = bgStartAudio.querySelector('h1');
        const appContainer = document.querySelector('.app-container');
        const bgMusic = document.getElementById('bg-music');
        const volumeControl = document.getElementById('volume-control');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeIcon = document.getElementById('volume-icon');

        let lastVolume = parseFloat(volumeSlider.value);
        bgMusic.volume = lastVolume;

        function updateVolumeIcon(v) {
            volumeIcon.style.opacity = v == 0 ? '0.4' : '1';
        }

        function setVolume(v) {
            bgMusic.volume = v;
            volumeSlider.value = v;
            updateVolumeIcon(v);
        }

        volumeSlider.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            bgMusic.volume = v;
            if (v > 0) lastVolume = v;
            updateVolumeIcon(v);
        });

        volumeIcon.addEventListener('click', () => {
            if (bgMusic.volume > 0) {
                lastVolume = bgMusic.volume;
                setVolume(0);
            } else {
                setVolume(lastVolume || 0.1);
            }
        });

        function revealApp() {
            bgStartAudio.style.pointerEvents = 'none';
            bgStartAudio.style.opacity = '0';
            bgStartAudioH1.style.opacity = '0';

            setTimeout(() => {
                document.body.style.overflowY = 'auto';
                appContainer.classList.add('animate-in');
                volumeControl.classList.add('animate-in');

                document.querySelectorAll('.section').forEach(s => s.classList.add('visible'));
            }, 100);

            bgMusic.play().catch((error) => {
                console.log("Autoplay failed:", error);
            });
        }
        document.addEventListener('click', revealApp, { once: true });

        document.addEventListener('DOMContentLoaded', () => {
            initializeProfile();

            createGenericCards('.bio-links-grid', CONFIG.links);
            createCurrentStaffCards(CONFIG.currentStaff);

            createCategory('staffExperience', 'Discord', 'fa-brands fa-discord', CONFIG.staffExperience.discord);
            createCategory('staffExperience', 'Minecraft', 'fa-solid fa-cube', CONFIG.staffExperience.minecraft);

            document.querySelectorAll('.panel-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const sectionId = item.getAttribute('data-section');

                    if (sectionId === 'profileBio') {
                        window.scrollTo({
                            top: 0,
                            behavior: 'smooth'
                        });
                    } else {
                        const targetSection = document.getElementById(sectionId);
                        if (targetSection) {
                            const scrollPosition = targetSection.offsetTop - 40;
                            window.scrollTo({
                                top: scrollPosition,
                                behavior: 'smooth'
                            });
                        }
                    }
                });
            });

            window.addEventListener('scroll', highlightActiveSection);
            highlightActiveSection();
        });
    </script>

</body>

</html>
