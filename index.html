<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dh3j</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
    color-scheme: dark;
    --page: #080808;
    --panel: #101010;
    --panel-raised: #151515;
    --line: rgba(255,255,255,.09);
    --muted: #929292;
    --white: #f7f7f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: hidden;
    background: var(--page);
    color: var(--white);
    font: 14px/1.65 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }
svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.125em; flex-shrink: 0; }
::selection { background: #fff; color: #080808; }
:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

#bg-start-audio {
    position: fixed; inset: 0; z-index: 100000000; background: #000;
    display: flex; justify-content: center; align-items: center;
    transition: opacity .2s ease-in-out; cursor: pointer;
}
#bg-start-audio h1 { transition: opacity .05s ease-in-out; }
#volume-control {
    position: fixed; top: 22px; right: 22px; z-index: 10000;
    display: flex; flex-direction: column; align-items: center;
    width: 46px; height: 46px; overflow: hidden;
    border: 1px solid var(--line); border-radius: 8px;
    background: rgba(17,17,17,.88); color: #fff;
    opacity: 0; backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
    transition: opacity .4s ease, height .25s ease, border-color .2s ease;
}
#volume-control.animate-in { opacity: 1; }
#volume-control:hover, #volume-control:focus-within { height: 150px; border-color: rgba(255,255,255,.24); }
#volume-icon-wrap { display: flex; flex: 0 0 44px; align-items: center; justify-content: center; width: 44px; cursor: pointer; }
#volume-icon { width: 18px; height: 18px; color: #fff; transition: opacity .2s ease; }
#volume-slider-wrap { display: flex; width: 44px; height: 0; align-items: center; justify-content: center; overflow: hidden; opacity: 0; transition: height .25s ease, opacity .2s ease; }
#volume-control:hover #volume-slider-wrap, #volume-control:focus-within #volume-slider-wrap { height: 100px; opacity: 1; }
#volume-slider { width: 80px; height: 3px; appearance: none; border-radius: 2px; background: #454545; cursor: pointer; transform: rotate(-90deg); }
#volume-slider::-webkit-slider-thumb { width: 12px; height: 12px; appearance: none; border-radius: 50%; background: #fff; }
#volume-slider::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }
.scroll-progress { position: fixed; inset: 0 0 auto; z-index: 1000; height: 2px; }
.scroll-progress-bar { width: 0; height: 100%; background: #fff; transition: width .2s ease; }
.app-container { min-height: 100vh; opacity: 0; transition: opacity .5s ease; }
.app-container.animate-in { opacity: 1; }

#listView { min-height: 100vh; }
.left-panel {
    position: sticky; top: 16px; z-index: 100;
    display: flex; width: max-content; max-width: calc(100% - 32px);
    align-items: center; justify-content: center; gap: 5px;
    margin: 20px auto 0; padding: 6px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #101010;
}
.panel-header { display: none; }
.panel-item {
    display: inline-flex; min-height: 42px; align-items: center; justify-content: center; gap: 9px;
    padding: 0 16px; border: 0; border-radius: 5px;
    background: transparent; color: #aaa; font: inherit; font-weight: 500;
    cursor: pointer; transition: color .2s ease, background .2s ease, transform .2s ease;
}
.panel-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.panel-item:active { transform: scale(.97); }
.panel-item.active { background: #292929; color: #fff; }
.main-content {
    display: flex; flex-direction: column; align-items: center;
    max-width: none; margin: 0 auto; padding: 36px 24px 80px;
}
.page { display: none; }
.page.show { display: block; }
.section {
    width: 100%; max-width: 960px; margin: 0 auto 36px; padding: clamp(24px, 5vw, 54px);
    scroll-margin-top: 100px; border: 1px solid var(--line); border-radius: 10px;
    background: #101010;
}
.section-header {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 38px;
    color: #aaa; font-size: 1.125rem; font-weight: 700;
}
.section-header .ic { color: #fff; font-size: 1rem; }
.about-section {
    width: calc(100% + 48px); max-width: none; margin: 0 0 36px; padding: 0;
    border: 0; border-radius: 0; background: transparent;
}
.about-section > .section-header { max-width: 960px; margin: 24px auto 18px; padding: 0 24px; }
.about-banner {
    position: relative; display: flex; width: 100%; min-height: clamp(300px, 48vw, 560px);
    align-items: flex-end; justify-content: space-between; gap: 32px; overflow: hidden; padding: 7vw 9vw;
    background: var(--page);
}
.about-banner-image, .about-banner-shade { position: absolute; inset: 0; width: 100%; height: 100%; }
.about-banner-image {
    object-fit: cover;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent), linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent), linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent);
    mask-composite: intersect;
}
.about-banner-shade {
    background: linear-gradient(0deg, rgba(0,0,0,.2), transparent 70%);
}
.about-banner h1 { position: relative; z-index: 1; color: #fff; font-size: clamp(3.5rem, 11vw, 7.5rem); font-weight: 900; letter-spacing: -.02em; line-height: .95; transition: color .2s ease; }
.about-banner[data-wordmark-tone="light"] h1 { color: #111; }
.about-banner[data-info-tone="light"] .banner-info { color: #111; }
.about-banner[data-info-tone="light"] .banner-info .subtitle { color: #111; }
.about-banner[data-info-tone="light"] .banner-facts li { border-top-color: rgba(0,0,0,.22); }
.about-banner[data-info-tone="light"] .banner-facts span { color: rgba(0,0,0,.72); }
.banner-info {
    position: relative; z-index: 1; width: min(330px, 42%); padding: 18px 0;
    color: #fff;
}
.banner-info .subtitle { justify-content: flex-start; margin: 0 0 12px; color: #fff; font-size: 1rem; }
.banner-facts { display: grid; gap: 7px; list-style: none; }
.banner-facts li { display: flex; justify-content: space-between; gap: 12px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.22); font-size: .85rem; }
.banner-facts span { color: rgba(255,255,255,.78); }
.banner-wordmark { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.about-staff { width: min(100% - 48px, 1100px); margin: 0 auto 56px; padding: 0 12px; }
.about-staff h2 { margin-bottom: 12px; font-size: 1.125rem; font-weight: 600; }
#currentStaffGrid { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
#currentStaffGrid .staff-entry {
    position: relative; display: grid; min-height: 68px; grid-template-columns: minmax(0, 1fr) auto 18px;
    flex-direction: row; justify-content: initial; gap: 14px; padding: 12px 10px;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left;
}
#currentStaffGrid .staff-entry.has-logo { grid-template-columns: 38px minmax(0, 1fr) auto 18px; }
#currentStaffGrid .staff-entry::before { height: 2px; }
#currentStaffGrid .staff-entry:hover { background: rgba(255,255,255,.035); }
#currentStaffGrid .staff-mark { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 6px; color: #ddd; }
#currentStaffGrid .staff-mark img { width: 100%; height: 100%; border-radius: 5px; object-fit: cover; }
#currentStaffGrid .staff-entry h4 { justify-content: flex-start; margin: 0; font-size: 1.05rem; font-weight: 600; }
#currentStaffGrid .staff-entry .chip { font-size: .75rem; }
#currentStaffGrid .staff-go { align-self: center; color: #777; }
.about-content { display: flex; flex-direction: column; gap: 28px; width: min(100% - 48px, 1100px); margin: 0 auto; padding: 28px 0; }
.contact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.about-copy { padding: 8px 0; }
.about-content figure { margin: 0; }
.about-copy h2 { margin-bottom: 12px; font-size: 1.15rem; font-weight: 700; }
.about-copy p { color: #c5c5c5; white-space: pre-line; }
.about-copy p + p { margin-top: 1rem; }
.about-image { display: block; width: 100%; max-height: 720px; margin: 0 auto; object-fit: cover; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%); }
.about-caption { padding: 10px 0; color: var(--muted); font-size: .8rem; }
.about-empty { padding: 24px 0; color: #aaa; text-align: center; }
.hero-content { text-align: center; }
.profile-wrapper { position: relative; display: inline-block; width: 154px; height: 154px; margin-bottom: 15px; }
.profile-border {
    position: absolute; inset: 0; z-index: 0; border-radius: 50%;
    background: #555;
}
.profile-image {
    position: absolute; inset: 5px; z-index: 1; overflow: hidden;
    border: 5px solid var(--panel); border-radius: 50%; background: #111;
    box-shadow: none;
}
.profile-inner { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; overflow: hidden; border-radius: 50%; }
.profile-inner img { width: 100%; height: 100%; object-fit: cover; }
@keyframes rotate { to { transform: rotate(360deg); } }
#profileName { margin-top: 5px; font-size: clamp(2.8rem, 8vw, 5rem); font-weight: 900; letter-spacing: -.02em; line-height: 1.08; }
.subtitle { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 0; color: #bbb; font-size: 1.25rem; font-weight: 500; }
.subtitle .ic { color: #888; }
.bio-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; color: #bbb; }
.bio-tab { padding: 7px 12px; border: 1px solid var(--line); border-radius: 5px; background: #141414; font-size: .8rem; }
.bio-tab strong { color: #fff; }
.bio-block { margin-top: 48px; }
.block-title {
    display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 16px;
    color: #aaa; font-size: 1rem; font-weight: 700; text-align: left;
}
.block-title .ic { color: #eee; font-size: .95rem; }
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.server-card {
    position: relative; display: flex; min-height: 112px; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; padding: 20px; border: 1px solid var(--line); border-radius: 8px;
    background: #121212; color: inherit; text-align: center; text-decoration: none;
    transition: border-color .2s ease, background .2s ease;
}
.server-card[data-href] { cursor: pointer; }
.server-card::before { position: absolute; inset: 0 0 auto; height: 2px; background: #fff; content: ''; transform: scaleX(0); transition: transform .3s ease; }
.server-card[data-href]:hover::before, .server-card[data-href]:focus-visible::before { transform: scaleX(1); }
.server-card[data-href]:hover { border-color: rgba(255,255,255,.2); background: #181818; }
.server-card h4 { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; font-size: 1.125rem; font-weight: 600; }
.chip {
    display: inline-flex; align-items: center; width: fit-content; max-width: 100%;
    padding: 5px 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 5px;
    background: rgba(255,255,255,.06); font-size: .75rem; font-weight: 600;
    letter-spacing: .05em; line-height: 1.4; text-transform: uppercase;
}

.exp-group + .exp-group { margin-top: 34px; }
.exp-group h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; font-size: 1rem; font-weight: 600; }
.exp-group h3 .ic { color: #aaa; }
.exp-count { display: inline-grid; min-width: 23px; height: 23px; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: #aaa; font-size: .85rem; font-weight: 500; }
.exp-list { display: flex; flex-direction: column; gap: 9px; }
.exp-row {
    position: relative; display: flex; min-height: 72px; align-items: center; gap: 14px; overflow: hidden; padding: 13px 16px;
    border: 1px solid var(--line); border-radius: 8px; background: #121212;
    cursor: pointer; transition: border-color .2s ease, background .2s ease;
}
.exp-row::before { position: absolute; inset: 0 0 auto; height: 2px; background: #fff; content: ''; transform: scaleX(0); transition: transform .3s ease; }
.exp-row:hover::before, .exp-row:focus-visible::before { transform: scaleX(1); }
.exp-row:hover { border-color: rgba(255,255,255,.2); background: #181818; }
.exp-row .logo { display: flex; width: 38px; height: 38px; flex: 0 0 38px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; color: #eee; font-size: 1.1rem; }
.exp-row .logo img { display: block; width: 100%; height: 100%; border-radius: 5px; object-fit: cover; }
.exp-row .name { font-size: 1.05rem; font-weight: 600; }
.exp-row .year { color: var(--muted); font-size: .8rem; }
.exp-row .chip { margin-left: auto; }
.exp-row .go { margin-left: 2px; color: #777; transition: color .2s ease, transform .2s ease; }
.exp-row:hover .go { transform: translateX(3px); color: #fff; }

#detailView { display: none; padding: 36px 24px 80px; }
.detail-wrap { max-width: 820px; margin: 0 auto; }
.back-btn {
    display: inline-flex; align-items: center; gap: 9px; margin-bottom: 18px; padding: 10px 16px;
    border: 1px solid var(--line); border-radius: 6px; background: #111; color: #fff;
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
}
.back-btn:hover { border-color: rgba(255,255,255,.24); background: #1a1a1a; }
.back-btn .ic { transition: transform .2s ease; }
.back-btn:hover .ic { transform: translateX(-3px); }
.detail-card { padding: clamp(24px, 5vw, 48px); border: 1px solid var(--line); border-radius: 10px; background: #101010; }
.detail-card h1 { font-size: clamp(2.2rem, 7vw, 3.8rem); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; }
.detail-meta .year { color: #aaa; }
.detail-text { max-width: 68ch; margin-top: 28px; color: #ccc; font-size: 1rem; line-height: 1.85; }
.detail-text p + p { margin-top: 1rem; }
.detail-text .empty { color: #888; font-style: italic; }
.preview-title { display: flex; align-items: center; gap: 8px; margin: 34px 0 13px; font-size: 1rem; font-weight: 700; }
.preview { display: block; overflow: hidden; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 8px; background: #0b0b0b; transition: border-color .2s ease; }
.preview:hover { border-color: rgba(255,255,255,.24); }
.preview img { display: block; width: 100%; height: auto; }
.preview .fallback { padding: 20px; color: #aaa; text-align: center; }

@media (max-width: 640px) {
    .left-panel { top: 10px; margin-top: 12px; }
    .panel-item { min-height: 40px; gap: 7px; padding: 0 14px; font-size: .82rem; }
    .main-content { padding: 24px 14px 60px; }
    .section { padding: 25px 18px; border-radius: 10px; }
    .about-section { width: calc(100% + 28px); margin-left: 0; padding: 0; }
    .about-section > .section-header { margin: 16px auto; padding: 0 14px; }
    .about-banner { min-height: 390px; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 20px; padding: 30px 8vw; }
    .banner-info { width: min(320px, 100%); padding: 12px 0; }
    .about-content { gap: 20px; width: calc(100% - 36px); padding: 20px 0; }
    .about-staff { width: calc(100% - 36px); margin-bottom: 42px; padding: 0 8px; }
    .contact-grid { grid-template-columns: 1fr; }
    .section-header { margin-bottom: 30px; }
    .profile-wrapper { width: 136px; height: 136px; }
    .profile-image { inset: 4px; border-width: 4px; }
    .bio-block { margin-top: 36px; }
    .card-grid { grid-template-columns: 1fr; gap: 9px; }
    .server-card { min-height: 96px; }
    .exp-row { flex-wrap: wrap; gap: 9px; padding: 12px; }
    .exp-row .chip { order: 3; margin-left: 47px; }
    .exp-row .go { margin-left: auto; }
    #volume-control { top: auto; right: 14px; bottom: 14px; }
    #detailView { padding: 24px 14px 60px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>

<body>
<div id="bg-start-audio"><h1>Click Anywhere</h1></div>

<audio id="bg-music" loop>
    <source src="./assets/song.mp3" type="audio/mpeg">
    <source src="./assests/song.mp3" type="audio/mpeg">
    Il tuo browser non supporta l'elemento audio.
</audio>

<div id="volume-control">
    <div id="volume-icon-wrap">
        <svg id="volume-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
            <defs><mask id="volumeIconMask"><g fill="none" stroke="#fff" stroke-width="4">
                <path fill="#555" stroke-linejoin="round" d="M24 6v36c-7 0-12.201-9.16-12.201-9.16H6a2 2 0 0 1-2-2V17.01a2 2 0 0 1 2-2h5.799S17 6 24 6Z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M32 15a11.91 11.91 0 0 1 1.684 1.859A12.07 12.07 0 0 1 36 24c0 2.654-.846 5.107-2.278 7.09A11.936 11.936 0 0 1 32 33"></path>
                <path stroke-linecap="round" d="M34.236 41.186C40.084 37.696 44 31.305 44 24c0-7.192-3.796-13.496-9.493-17.02"></path>

            <path fill="currentColor" d="M0 0h48v48H0z" mask="url(#volumeIconMask)"></path>

</div>

<div class="scroll-progress"><div class="scroll-progress-bar"></div></div>

<div class="app-container">

    <!-- ===== MAIN VIEW: Bio + Experiences ===== -->
    <div id="listView">
        <nav class="left-panel" aria-label="Main navigation">
            <div class="panel-header"><i class="fa-solid fa-list"></i></div>
            <button class="panel-item" type="button" data-page="about"><i class="fa-solid fa-user"></i><span>About</span></button>
            <button class="panel-item" type="button" data-page="experiences"><i class="fa-solid fa-briefcase"></i><span>Experiences</span></button>
            <button class="panel-item" type="button" data-page="contact"><i class="fa-solid fa-link"></i><span>Contact</span></button>
        </nav>

        <div class="main-content">
            <section class="section page about-section show" id="about" data-page="about">
                <div class="section-header"><i class="fa-solid fa-user"></i><span>About</span></div>
                <div class="about-banner" id="aboutBanner">
                    <div class="about-banner-shade"></div>
                    <div class="banner-wordmark">
                        <h1 id="aboutBannerName"></h1>
                    </div>
                    <div class="banner-info">
                        <p class="subtitle" id="profileSubtitle"></p>
                        <ul class="banner-facts">

                            <li><span>Time Zone</span><strong>GMT+1</strong></li>

                </div>

                <section class="about-staff" aria-labelledby="currentStaffHeading">

        </div>

    <!-- ===== DETAIL VIEW: one experience ===== -->
    <div id="detailView">
        <div class="detail-wrap">
            <button class="back-btn" id="backBtn" type="button"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <article class="detail-card" id="detailCard"></article>
        </div>
    </div>
</div>

<script>
/* =====================================================================
   CONFIG — edit everything here.
   Optional currentStaff logo: add `logo: "staff.png"` or an Imgur link to a staff item.
   About banner: set `about.banner` to an Imgur link or image path such as "assets/banner.jpg".
   About content: add text blocks { type: "text", heading: "Title", text: "..." }
   and image blocks { type: "image", src: "photo.jpg", alt: "Description", caption: "..." }.
   Local images should be placed in the `assets` folder next to this HTML file.
   For each experience, write your story in `text`.
   - Blank line = new paragraph.
   - Imgur links stay in `imgurLink`; they show up as previews under the text.
   - Want more than one screenshot? add `imgurLinks: ["https://imgur.com/...", "..."]`
   - Optional `logo: "https://imgur.com/xxxxx"` = image shown instead of the cube/Discord icon before the server name.
   ===================================================================== */
const CONFIG = {
    profile: { name: "dh3j", subtitle: "Student & Screenshare" },
    about: {
        banner: "assets/banner.jpg",
        content: []
    },
    currentStaff: [
        { serverName: "Eclipse Forensics", role: "Integrity Team", color: "#a78bfa" }
    ],
    staffExperience: {
        discord: [
            {
                serverName: "SpyralMC", role: "Beta Tester", color: "#b134eb",
                imgurLink: "https://imgur.com/Fa6dmYQ",
                text: `Beta tester for SMP season 3`,
                logo: "https://imgur.com/B4PeP1C"
            }
        ],
        minecraft: [
            {

function swapIcons(root) {
    (root || document).querySelectorAll('i[class*="fa-"]').forEach(el => {
        const names = el.className.split(/\s+/);
        const key = names.filter(c => c.startsWith('fa-') && ICONS[c.slice(3)]).map(c => c.slice(3)).pop();
        if (!key) return;
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('class', ['ic'].concat(names.filter(c => !c.startsWith('fa-'))).join(' '));
        if (el.getAttribute('style')) svg.setAttribute('style', el.getAttribute('style'));
        // Official Discord logo is filled (not stroked)
        if (key === 'discord') {
            svg.style.fill = 'currentColor';
            svg.style.stroke = 'none';
        }
        svg.innerHTML = ICONS[key];
        el.replaceWith(svg);
    });
}
new MutationObserver(() => swapIcons()).observe(document.documentElement, { childList: true, subtree: true });

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function hexToRgba(hex, a) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const n = parseInt(c, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function tint(el, color) {
    if (!color) return;
    el.style.background = hexToRgba(color, 0.12);
    el.style.borderColor = hexToRgba(color, 0.25);
    el.style.color = color;
}
function imgurId(url) {
    const m = String(url).match(/imgur\.com\/(?:a\/|gallery\/)?([A-Za-z0-9]+)/);
    return m ? m[1] : null;
}

function initializeProfile() {

function buildCards(container, items) {
    items.forEach(item => {
        const destination = item.link || item.imgurLink;
        const card = document.createElement(destination ? 'a' : 'div');
        card.className = 'server-card';
        if (destination) {
            card.dataset.href = destination;
            card.href = destination;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
        }
        const title = item.name || item.serverName;
        if (container.id === 'currentStaffGrid') {
            card.classList.add('staff-entry');
            const logoId = item.logo ? imgurId(item.logo) : null;
            const logoSrc = item.logo ? (logoId ? `https://i.imgur.com/${logoId}.png` : item.logo) : '';
            if (logoSrc) {
                card.classList.add('has-logo');
                const logo = document.createElement('span');
                logo.className = 'staff-mark';
                const image = document.createElement('img');
                image.src = logoSrc;
                image.alt = '';
                image.loading = 'lazy';
                image.addEventListener('error', () => {
                    logo.remove();
                    card.classList.remove('has-logo');
                }, { once: true });
                logo.appendChild(image);
                card.appendChild(logo);
            }
            const heading = document.createElement('h4');
            heading.textContent = title;
            const role = document.createElement('span');
            role.className = 'chip';
            role.textContent = item.role;
            const arrow = document.createElement('i');
            arrow.className = 'fa-solid fa-chevron-right staff-go';
            card.append(heading, role, arrow);
        } else {
            card.innerHTML = `<h4>${item.icon ? `<i class="${item.icon}"></i>&nbsp;` : ''}${esc(title)}</h4><span class="chip">${esc(item.role)}</span>`;
        }
        tint(card.querySelector('.chip'), item.color);
        container.appendChild(card);
    });
}

function buildAbout() {
    const about = CONFIG.about || {};
    const banner = $('#aboutBanner');
    $('#aboutBannerName').textContent = CONFIG.profile.name;
    banner.dataset.wordmarkTone = 'dark';
    banner.dataset.infoTone = 'dark';
    banner.querySelector('.about-banner-image')?.remove();
    if (about.banner) {
        const bannerId = imgurId(about.banner);
        const bannerSource = bannerId ? `https://i.imgur.com/${bannerId}.png` : about.banner;
        const image = document.createElement('img');
        image.className = 'about-banner-image';
        image.alt = '';
        image.addEventListener('load', () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const context = canvas.getContext('2d', { willReadFrequently: true });
                if (!context) throw new Error('Canvas 2D context is unavailable.');
                const imageRatio = image.naturalWidth / image.naturalHeight;
                const bannerBox = banner.getBoundingClientRect();
                const bannerRatio = bannerBox.width / bannerBox.height;
                let sourceX = 0;
                let sourceY = 0;
                let sourceWidth = image.naturalWidth;
                let sourceHeight = image.naturalHeight;
                if (imageRatio > bannerRatio) {
                    sourceWidth = image.naturalHeight * bannerRatio;
                    sourceX = (image.naturalWidth - sourceWidth) / 2;
                } else {
                    sourceHeight = image.naturalWidth / bannerRatio;
                    sourceY = (image.naturalHeight - sourceHeight) / 2;
                }
                context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);
                const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
                const toneFor = element => {
                    const rect = element.getBoundingClientRect();
                    const left = Math.max(0, Math.floor((rect.left - bannerBox.left) / bannerBox.width * canvas.width));
                    const right = Math.min(canvas.width, Math.ceil((rect.right - bannerBox.left) / bannerBox.width * canvas.width));
                    const top = Math.max(0, Math.floor((rect.top - bannerBox.top) / bannerBox.height * canvas.height));
                    const bottom = Math.min(canvas.height, Math.ceil((rect.bottom - bannerBox.top) / bannerBox.height * canvas.height));
                    let luminance = 0;
                    let count = 0;
                    for (let y = top; y < bottom; y++) {
                        for (let x = left; x < right; x++) {
                            const index = (y * canvas.width + x) * 4;
                            const imageLuminance = (0.2126 * pixels[index] + 0.7152 * pixels[index + 1] + 0.0722 * pixels[index + 2]) / 255;
                            const horizontalEdge = Math.min((x + 0.5) / canvas.width, (canvas.width - x - 0.5) / canvas.width);
                            const verticalEdge = Math.min((y + 0.5) / canvas.height, (canvas.height - y - 0.5) / canvas.height);
                            const maskOpacity = Math.min(1, horizontalEdge / 0.14) * Math.min(1, verticalEdge / 0.14);
                            luminance += imageLuminance * maskOpacity * 0.92 + (8 / 255) * (1 - maskOpacity);
                            count++;
                        }
                    }
                    return count && luminance / count > 0.45 ? 'light' : 'dark';
                };
                banner.dataset.wordmarkTone = toneFor($('#aboutBannerName'));
                banner.dataset.infoTone = toneFor(banner.querySelector('.banner-info'));
            } catch (error) {
                banner.dataset.wordmarkTone = 'dark';
                banner.dataset.infoTone = 'dark';
                console.warn('Could not detect banner brightness; using white banner text.', error);
            }
        }, { once: true });
        const bannerSources = bannerId ? [bannerSource] : [
            bannerSource,
            bannerSource.replace(/^\.\/assets\//, './assests/'),
            bannerSource.replace(/^\.\/assests\//, './assets/'),
            bannerSource.replace(/^assets\//, 'assests/'),
            bannerSource.replace(/^assests\//, 'assets/')
        ].filter((source, index, sources) => sources.indexOf(source) === index);
        let bannerSourceIndex = 0;
        image.addEventListener('error', () => {
            bannerSourceIndex++;
            if (bannerSourceIndex < bannerSources.length) {
                image.src = bannerSources[bannerSourceIndex];
                return;
            }
            console.warn(`Could not load About banner image: ${about.banner}`);
            image.remove();
        });
        banner.prepend(image);
        image.src = bannerSources[0];
    }

    const content = $('#aboutContent');
    content.replaceChildren();
    const blocks = Array.isArray(about.content) ? about.content : [];
    if (!blocks.length) {
        const empty = document.createElement('p');
        empty.className = 'about-empty';
        empty.textContent = 'Add text or image blocks in CONFIG.about.content to fill out your About page.';
        content.appendChild(empty);
        return;
    }

    blocks.forEach(block => {
        if (!block || typeof block !== 'object') return;
        if (block.type === 'text') {
            const article = document.createElement('article');
            article.className = 'about-copy';
            if (block.heading) {
                const heading = document.createElement('h2');
                heading.textContent = block.heading;
                article.appendChild(heading);
            }
            String(block.text || '').trim().split(/\n\s*\n/).filter(Boolean).forEach(paragraph => {
                const p = document.createElement('p');
                p.textContent = paragraph;
                article.appendChild(p);
            });
            content.appendChild(article);
        } else if (block.type === 'image' && block.src) {
            const figure = document.createElement('figure');
            const image = document.createElement('img');
            image.className = 'about-image';
            image.src = block.src;
            image.alt = block.alt || '';
            image.loading = 'lazy';
            image.addEventListener('error', () => figure.remove(), { once: true });
            figure.appendChild(image);
            if (block.caption) {
                const caption = document.createElement('figcaption');
                caption.className = 'about-caption';
                caption.textContent = block.caption;
                figure.appendChild(caption);
            }
            content.appendChild(figure);
        }
    });
}

/* ---------- experiences list ---------- */
function buildExperiences() {
    const root = $('#expGroups');
    GROUPS.forEach(g => {
        const list = CONFIG.staffExperience[g.key] || [];
        if (!list.length) return;
        const group = document.createElement('div');
        group.className = 'exp-group';
        group.innerHTML = `<h3><i class="${g.icon}"></i> ${g.title} <span class="exp-count">${list.length}</span></h3><div class="exp-list"></div>`;
        const ul = group.querySelector('.exp-list');

        list.forEach((exp, i) => {
            const row = document.createElement('div');
            row.className = 'exp-row';
            row.tabIndex = 0;
            row.setAttribute('role', 'link');
            row.style.setProperty('--c', exp.color || '#fff');
            const logoId = exp.logo ? imgurId(exp.logo) : null;
            const logoHtml = logoId
                ? `<span class="logo" data-id="${logoId}"><img src="https://i.imgur.com/${logoId}.png" alt="" loading="lazy" referrerpolicy="no-referrer" data-try="0"></span>`
                : `<i class="${g.icon} logo"></i>`;
            row.innerHTML = `
                ${logoHtml}
                <span class="name">${esc(exp.serverName)}</span>
                ${exp.year ? `<span class="year">${esc(exp.year)}</span>` : ''}
                <span class="chip">${esc(exp.role)}</span>
                <i class="fa-solid fa-chevron-right go"></i>`;
            tint(row.querySelector('.chip'), exp.color);
            // imgur extension fallback for row logos
            row.querySelectorAll('.logo img').forEach(img => {
                const exts = ['png', 'jpg', 'jpeg'];
                img.addEventListener('error', () => {
                    const id = img.parentElement.dataset.id;
                    const n = +img.dataset.try + 1;
                    if (n < exts.length) { img.dataset.try = n; img.src = `https://i.imgur.com/${id}.${exts[n]}`; }
                    else {
                        const fb = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        // leave empty; swapIcons won't run; use text fallback
                        img.replaceWith(document.createTextNode(''));
                        img.parentElement.innerHTML = ''; // keep size via CSS
                    }
                });
            });
            const open = () => { location.hash = `#/${g.key}/${i}`; };
            row.addEventListener('click', open);
            row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
            ul.appendChild(row);
        });
        root.appendChild(group);
    });
}

/* ---------- detail page ---------- */
function previewHtml(url) {
    const id = imgurId(url);
    if (!id) return `<a class="preview" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><div class="fallback">Open link</div></a>`;
    return `<a class="preview" href="${esc(url)}" target="_blank" rel="noopener noreferrer" data-id="${id}">
        <img src="https://i.imgur.com/${id}.png" alt="Preview" loading="lazy" referrerpolicy="no-referrer" data-try="0">
    </a>`;
}

function showDetail(groupKey, index) {
    const exp = (CONFIG.staffExperience[groupKey] || [])[index];
    if (!exp) { location.hash = ''; return; }
    const group = GROUPS.find(g => g.key === groupKey);

    const paragraphs = String(exp.text || '').trim().split(/\n\s*\n/).filter(Boolean);
    const textHtml = paragraphs.length
        ? paragraphs.map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('')
        : `<p class="empty">Nothing written here yet. Add a "text" to this experience in CONFIG.</p>`;

    const links = exp.imgurLinks || (exp.imgurLink ? [exp.imgurLink] : []);

    const card = $('#detailCard');
    card.style.setProperty('--c', exp.color || '#fff');
    card.innerHTML = `
        <h1>${esc(exp.serverName)}</h1>
        <div class="detail-meta">
            <span class="chip">${esc(exp.role)}</span>
            <span class="year"><i class="${group.icon}"></i> ${group.title}${exp.year ? ' · ' + esc(exp.year) : ''}</span>
        </div>
        <div class="detail-text">${textHtml}</div>
        ${links.length ? `<div class="preview-title"><i class="fa-regular fa-image"></i> Preview</div>${links.map(previewHtml).join('')}` : ''}`;
    tint(card.querySelector('.chip'), exp.color);

    // imgur doesn't care about the extension, but fall back just in case
    card.querySelectorAll('.preview img').forEach(img => {
        const exts = ['png', 'jpg', 'jpeg'];
        img.addEventListener('error', () => {
            const id = img.parentElement.dataset.id;
            const n = +img.dataset.try + 1;
            if (n < exts.length) { img.dataset.try = n; img.src = `https://i.imgur.com/${id}.${exts[n]}`; }
            else img.replaceWith(Object.assign(document.createElement('div'), { className: 'fallback', textContent: 'Preview unavailable, click to open on Imgur' }));
        });
    });
}

/* ---------- routing (hash based, so the music keeps playing) ---------- */
let expScroll = 0;
function route() {
    const h = location.hash;
    const m = h.match(/^#\/(\w+)\/(\d+)$/);
    const listView = $('#listView'), detailView = $('#detailView');
    if (m) {
        if (listView.style.display !== 'none') expScroll = window.scrollY;
        showDetail(m[1], +m[2]);
        listView.style.display = 'none';
        detailView.style.display = 'block';
        window.scrollTo(0, 0);
    } else {
        const page = h === '#/experiences' ? 'experiences' : h === '#/contact' ? 'contact' : 'about';
        const wasDetail = detailView.style.display === 'block';
        detailView.style.display = 'none';
        listView.style.display = 'block';
        document.querySelectorAll('.page').forEach(section => section.classList.toggle('show', section.dataset.page === page));
        document.querySelectorAll('.panel-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
        window.scrollTo({ top: wasDetail && page === 'experiences' ? expScroll : 0, behavior: 'instant' });
    }
    updateProgressBar();
}
function updateProgressBar() {
    const h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const y = document.body.scrollTop || document.documentElement.scrollTop;
    $('.scroll-progress-bar').style.width = (h > 0 ? (y / h) * 100 : 0) + '%';
}

/* ---------- audio / intro ---------- */
const bgStart = $('#bg-start-audio'), bgMusic = $('#bg-music'), volSlider = $('#volume-slider'), volIcon = $('#volume-icon');
let lastVolume = parseFloat(volSlider.value);
bgMusic.volume = lastVolume;
function setVolume(v) { bgMusic.volume = v; volSlider.value = v; volIcon.style.opacity = v == 0 ? '.4' : '1'; }
volSlider.addEventListener('input', e => { const v = parseFloat(e.target.value); if (v > 0) lastVolume = v; setVolume(v); });
volIcon.addEventListener('click', () => {
    if (bgMusic.volume > 0) { lastVolume = bgMusic.volume; setVolume(0); } else setVolume(lastVolume || 0.1);
});
document.addEventListener('click', () => {
    bgStart.style.pointerEvents = 'none';
    bgStart.style.opacity = '0';
    bgStart.querySelector('h1').style.opacity = '0';
    setTimeout(() => {
        document.body.style.overflowY = 'auto';
        $('.app-container').classList.add('animate-in');
        $('#volume-control').classList.add('animate-in');
    }, 100);
    bgMusic.play().catch(e => console.log('Autoplay failed:', e));
}, { once: true });

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', () => {
    initializeProfile();
    buildCards($('#linksGrid'), CONFIG.links);
    buildCards($('#currentStaffGrid'), CONFIG.currentStaff);
    buildExperiences();
    buildAbout();

    document.querySelectorAll('.panel-item').forEach(item => {
        item.addEventListener('click', () => { location.hash = `#/${item.dataset.page}`; });
    });

    $('#backBtn').addEventListener('click', () => { location.hash = '#/experiences'; });
    window.addEventListener('hashchange', route);
    window.addEventListener('scroll', updateProgressBar);
    route();
    swapIcons();
});
</script>
